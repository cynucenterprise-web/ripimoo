<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient (Deep Rich Teal to Emerald) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>

    <!-- Front Sheet Gradient -->
    <linearGradient id="paper-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdfa" />
    </linearGradient>

    <!-- Realtime Sync Pulse Gradient -->
    <linearGradient id="sync-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Soft Drop Shadow for Document Elevation -->
    <filter id="doc-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#042f2e" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)" />

  <!-- Subtle Precision Grid Lines (Google Engineering Style) -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="2 3" />
  <line x1="32" y1="8" x2="32" y2="56" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="2 3" />

  <!-- Document 1: Back Sheet (Cover Letter Layer with Teal Tint) -->
  <g opacity="0.85">
    <rect x="13" y="11" width="28" height="38" rx="4" fill="#14b8a6" fill-opacity="0.4" stroke="#5eead4" stroke-opacity="0.6" stroke-width="1.5" />
    <!-- Cover Letter Header & Lines -->
    <line x1="18" y1="18" x2="28" y2="18" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8" />
    <line x1="18" y1="24" x2="35" y2="24" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6" />
    <line x1="18" y1="29" x2="32" y2="29" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6" />
  </g>

  <!-- Document 2: Front Sheet (Curriculum Vitae Layer with Elevation) -->
  <g filter="url(#doc-shadow)">
    <rect x="23" y="15" width="28" height="38" rx="4" fill="url(#paper-front)" stroke="#ccfbf1" stroke-width="1" />
    <!-- CV Header (Bold Primary Name Line) -->
    <rect x="28" y="21" width="13" height="3" rx="1.5" fill="#0f766e" />
    <circle cx="45" cy="22.5" r="1.5" fill="#0d9488" />
    <!-- CV Content Lines (Precision Bullet Points) -->
    <line x1="28" y1="28" x2="46" y2="28" stroke="#0f766e" stroke-width="1.8" stroke-linecap="round" />
    <line x1="28" y1="33" x2="42" y2="33" stroke="#0d9488" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.85" />
    <line x1="28" y1="38" x2="44" y2="38" stroke="#0f766e" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Realtime Active Synchronization Loop (Connecting CV & Cover Letter in Live Sync) -->
  <path d="M15 36 C 11 44, 20 54, 30 52 C 37 50.5, 42 46, 44 42" fill="none" stroke="url(#sync-glow)" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Realtime Pulse Node (Glowing Active Calibration Dot) -->
  <circle cx="44" cy="42" r="3.5" fill="#2dd4bf" />
  <circle cx="44" cy="42" r="1.8" fill="#ffffff" />
</svg>
